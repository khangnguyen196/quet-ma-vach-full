# Build ảnh Docker của máy chủ OCR (server/), chạy thử container vừa build, rồi (CHỈ trên main) đẩy lên
# ghcr.io/khangnguyen196/quet-ma-vach-ocr với tag latest + 7 ký tự đầu của mã commit.
# Chỉ dùng GITHUB_TOKEN (không khóa Azure, không secret nào khác). Azure Container App do chủ dự án tự tạo
# trên Azure Portal trỏ vào ảnh này: server/AZURE.md. Không đụng workflow Pages (deploy.yml).
name: Server image

on:
  push:
    branches: ['**']
    paths:
      - 'server/**'
      - '.github/workflows/server-image.yml'
  workflow_dispatch:

# Chỉ đọc mã + ghi package (ghcr.io). Không quyền nào khác.
# Giữ packages: write ở cấp workflow trong 1 job (không tách job build / job đẩy): token chỉ dùng để đăng nhập ghcr.io
# khi ref là main; checkout có nhận token để lấy mã nhưng không lưu (persist-credentials: false); workflow không chạy
# pull_request (nên không có lượt từ fork); tách 2 job thì phải chuyển ảnh Docker giữa 2 job, phức tạp hơn lợi ích.
permissions:
  contents: read
  packages: write

# shell: bash -> GitHub chạy "bash --noprofile --norc -eo pipefail {0}": lệnh hỏng giữa ống "|" (vd docker push | tee)
# làm bước đỏ. Không khai thì GitHub chạy "bash -e {0}" (không pipefail): push hỏng mà bước vẫn xanh.
# Ống nào được phép hỏng thì ghi "|| true" rõ ràng.
defaults:
  run:
    shell: bash

# Mỗi nhánh 1 lượt một lúc; nhánh thường thì lượt mới hủy lượt cũ, main thì chờ (không hủy giữa lúc đẩy ảnh).
concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/khangnguyen196/quet-ma-vach-ocr
  LOCAL: local/ocr:test

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Ghim action bằng tag lớn như deploy.yml (actions/checkout@v7): nhận bản vá trong cùng bản lớn, không tự lên bản lớn mới.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # không cần git sau khi lấy mã: không để token trong .git/config

      # docker CLI có sẵn trên runner ubuntu (builder mặc định = BuildKit, driver docker): ảnh vào thẳng kho ảnh của máy
      # để docker run thử ngay, không cần thêm action build / buildx --load.
      # GIT_SHA = 7 ký tự đầu của mã commit (trùng tag đẩy lên ghcr.io): /health của ảnh trả ở trường "commit".
      - name: Build ảnh
        run: docker build --build-arg GIT_SHA="${GITHUB_SHA::7}" -t "$LOCAL" server/

      # Kho-lon vòng 4: giới hạn giống Container App (1 vCPU / 2 GiB, không có swap thêm). Tràn RAM thì container bị giết
      # và các bước sau đỏ: KHÔNG nới giới hạn để CI xanh.
      - name: Chạy container (AUTH_MODE=off chỉ để chạy thử, 1 CPU / 2 GiB như Azure) và chờ /health
        run: |
          start=$(date +%s%N)
          docker run -d --name ocr --memory=2g --memory-swap=2g --cpus=1 -e AUTH_MODE=off -e PORT=8080 -p 127.0.0.1:8080:8080 "$LOCAL"
          for i in $(seq 1 90); do
            if [ "$(docker inspect -f '{{.State.Running}}' ocr)" != "true" ]; then
              echo "::error::container đã dừng trước khi /health trả 200"
              docker logs ocr || true
              exit 1
            fi
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health)" = "200" ]; then
              secs=$(awk -v ns="$(( $(date +%s%N) - start ))" 'BEGIN { printf "%.1f", ns / 1e9 }')
              echo "STARTUP_SECONDS=$secs" >> "$GITHUB_ENV"
              echo "/health 200 sau $secs giây"
              curl -s http://127.0.0.1:8080/health; echo
              exit 0
            fi
            sleep 1
          done
          echo "::error::/health không trả 200 sau 90 giây"
          docker logs ocr || true
          exit 1

      # Ảnh vừa build phải báo đúng mã commit (chủ dự án mở <địa chỉ Azure>/health để biết Container App chạy ảnh nào).
      # curl hay python hỏng thì bước đỏ (pipefail), không "|| true".
      - name: /health trả đúng commit
        run: |
          got=$(curl -sf http://127.0.0.1:8080/health | python3 -c 'import json, sys; print(json.load(sys.stdin).get("commit", ""))')
          echo "/health commit: $got (cần: ${GITHUB_SHA::7})"
          if [ "$got" != "${GITHUB_SHA::7}" ]; then
            echo "::error::/health trả commit \"$got\", cần \"${GITHUB_SHA::7}\""
            exit 1
          fi

      # Đợt kho-lon vòng 3: ảnh có danh mục ứng viên dựng lúc build (CATALOG_PATH=/app/catalog-index mặc định);
      # /health phải báo catalog.loaded true và n = số dòng của danh mục trong repo. Hỏng thì bước đỏ (không "|| true").
      - name: /health có danh mục (catalog.loaded, n đúng)
        run: |
          n_want=$(gzip -dc server/catalog/*.jsonl.gz | grep -c .)
          got=$(curl -sf http://127.0.0.1:8080/health | python3 -c 'import json, sys; c = json.load(sys.stdin).get("catalog") or {}; print(c.get("loaded"), c.get("n"))')
          echo "/health catalog: $got (cần: True $n_want)"
          if [ "$got" != "True $n_want" ]; then
            echo "::error::/health catalog \"$got\", cần \"True $n_want\""
            exit 1
          fi
          echo "CATALOG_N=$n_want" >> "$GITHUB_ENV"

      # Kho-lon vòng 4 (NÊN SỬA 3 vòng 3): số H3 23,5 ms (Windows) là số bộ đệm ẤM (30 ảnh liền nhau). Ở đây xóa bộ đệm
      # trang của máy (container dùng chung bộ đệm với máy) để lượt chu.png ngay sau là lượt đầu, bộ đệm nguội (trang mmap
      # của chỉ mục phải đọc lại từ đĩa), gần ca máy chủ vừa thức dậy. Hỏng thì bước đỏ.
      - name: Xóa bộ đệm trang (lượt chu.png = lượt đầu, bộ đệm nguội)
        run: |
          sync && echo 3 | sudo tee /proc/sys/vm/drop_caches > /dev/null
          free -m

      - name: Gửi ảnh thử chu.png (PNG) và xoay6.heic (HEIC, kiểm libheif trên Linux)
        run: |
          code=$(curl -s -o png.json -w '%{http_code}' -F image=@server/tests/fixtures/chu.png http://127.0.0.1:8080/ocr)
          echo "chu.png: HTTP $code"; cat png.json; echo
          [ "$code" = "200" ] || { echo "::error::chu.png không trả 200"; exit 1; }
          # dòng log của lượt /ocr đầu tiên (có "tìm <ms>ms" = chỉ phần tìm ứng viên); không đọc được thì vẫn xanh
          line=$(docker logs ocr 2>&1 | grep -E "POST /ocr .*tìm" | head -n 1 || true)
          echo "log lượt đầu: ${line:-không đọc được}"
          echo "- Log /ocr chu.png (lượt đầu, bộ đệm nguội, Linux, chỉ tham khảo; H3 23,5 ms của vòng 3 là số bộ đệm ấm trên Windows): \`${line:-không đọc được}\`" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "server/tests/fixtures")
          from tao_chu import CHU_PNG_WORDS  # cùng danh sách chữ với test real_model
          j = json.load(open("png.json", encoding="utf-8"))
          text = " ".join(it["text"] for it in j["items"]).upper()
          missing = [w for w in CHU_PNG_WORDS if w not in text]
          print("chữ OCR:", text)
          if missing:
              sys.exit(f"thiếu chữ: {missing}")
          # kho-lon vòng 3: có danh mục thì /ocr luôn có khóa "candidates" là danh sách (rỗng được)
          cands = j.get("candidates")
          print("candidates:", None if cands is None else len(cands))
          sys.exit(0 if isinstance(cands, list) else "thiếu khóa candidates (danh sách)")
          PY
          code=$(curl -s -o heic.json -w '%{http_code}' -F image=@server/tests/fixtures/xoay6.heic http://127.0.0.1:8080/ocr)
          echo "xoay6.heic: HTTP $code"; cat heic.json; echo
          [ "$code" = "200" ] || { echo "::error::xoay6.heic không trả 200"; exit 1; }

      # Đợt kho-nhom vòng 4: ảnh có model CLIP (CLIP_MODEL_PATH mặc định) -> /health clip.loaded true; container này KHÔNG có
      # khóa ký (và AUTH_MODE=off) -> nhom.enabled false, /embed 503, /ocr không có khóa "nhom" (y hệt trước).
      - name: CLIP đã nạp, kho nhóm tắt khi không có khóa (/embed 503, /ocr không có "nhom")
        run: |
          got=$(curl -sf http://127.0.0.1:8080/health | python3 -c 'import json, sys; j = json.load(sys.stdin); print(j["clip"]["loaded"], j["clip"]["model"], j["nhom"]["enabled"])')
          echo "/health clip / nhom: $got (cần: True clip-vit-b32-int8-cat False)"
          if [ "$got" != "True clip-vit-b32-int8-cat False" ]; then
            echo "::error::/health clip / nhom \"$got\""
            exit 1
          fi
          python3 -c 'import json, sys; j = json.load(open("png.json", encoding="utf-8")); sys.exit("chu.png có khóa nhom khi kho nhóm tắt" if "nhom" in j else 0)'
          code=$(curl -s -o embed.json -w '%{http_code}' -F image=@server/tests/fixtures/chu.png -F duong_dan=0d0d0d0d-1111-4000-8000-0000000000aa/0a1b2c3d-0000-4000-8000-00000000c0de.png http://127.0.0.1:8080/embed)
          echo "/embed khi tắt: HTTP $code"; cat embed.json; echo
          [ "$code" = "503" ] || { echo "::error::/embed khi kho nhóm tắt phải 503"; exit 1; }
          echo "- Kho nhóm: CLIP đã nạp, không khóa -> nhom.enabled false, /embed 503, /ocr không có \"nhom\": đúng" >> "$GITHUB_STEP_SUMMARY"

      # Ảnh nặng nhất được nhận (JPEG nhiều lượt quét CMYK 40 MP, orientation 6, như server/do-anh-lon.py): sinh bằng Pillow
      # có sẵn trong ảnh, ở MỘT container riêng (không tính vào RAM của container ocr), không thêm file lớn vào repo.
      # Gửi trước bước đo RAM để memory.peak gồm ca nặng nhất.
      - name: Gửi ảnh nặng 40 MP (JPEG CMYK nhiều lượt quét)
        run: |
          mkdir -p anh-nang
          docker run --rm -u 0 -v "$PWD/anh-nang:/out" "$LOCAL" python -c 'from PIL import Image; g = Image.linear_gradient("L"); w, h = 8000, 5000; im = Image.merge("RGB", (g.resize((w, h)), g.rotate(90).resize((w, h)), Image.new("L", (w, h), 90))).convert("CMYK"); ex = Image.Exif(); ex[0x0112] = 6; im.save("/out/nang.jpg", "JPEG", quality=90, progressive=True, exif=ex.tobytes())'
          ls -l anh-nang/nang.jpg
          code=$(curl -s --max-time 300 -o nang.json -w '%{http_code}' -F image=@anh-nang/nang.jpg http://127.0.0.1:8080/ocr)
          echo "nang.jpg: HTTP $code"; head -c 300 nang.json; echo
          [ "$code" = "200" ] || { echo "::error::ảnh nặng 40 MP không trả 200"; exit 1; }

      - name: Đo cỡ ảnh, RAM
        run: |
          size=$(docker image inspect "$LOCAL" --format '{{.Size}}')
          mb=$(awk -v b="$size" 'BEGIN { printf "%.1f", b / 1048576 }')
          stats=$(docker stats --no-stream --format '{{.MemUsage}}' ocr)
          peak=$(docker exec ocr cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo "")
          if [ -n "$peak" ]; then peak_mb=$(awk -v b="$peak" 'BEGIN { printf "%.1f", b / 1048576 }'); else peak_mb="không đọc được"; fi
          # mỗi bước có file Summary riêng: ghi dạng danh sách (không ghép bảng qua nhiều bước)
          {
            echo "### Ảnh Docker máy chủ OCR (commit ${GITHUB_SHA::7})"
            echo "- Cỡ ảnh (docker image inspect): $mb MB ($size byte)"
            echo "- RAM lúc này (docker stats, sau 2 ảnh OCR + ảnh nặng 40 MP): $stats"
            echo "- RAM đỉnh (cgroup memory.peak, sau 2 ảnh OCR + ảnh nặng 40 MP): $peak_mb MB"
            echo "- Khởi động tới /health 200: ${STARTUP_SECONDS} giây"
            echo "- Danh mục ứng viên (/health catalog.n): ${CATALOG_N} sản phẩm"
            echo "- Container chạy với --memory=2g --memory-swap=2g --cpus=1 (như Container App 1 vCPU / 2 GiB); tràn RAM thì CI đỏ."
            echo "- memory.peak của cgroup tính cả bộ đệm file / trang mmap của chỉ mục đã chạm (không chỉ bộ nhớ riêng của tiến trình): không so thẳng với H2 Windows (đỉnh working set / bộ nhớ riêng)."
            echo "- Ảnh 40 MP ở đây là ảnh dải màu tự sinh (ít chữ): phần OCR có thể nhẹ hơn ảnh chụp thật cùng cỡ."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Không đặt AUTH_MODE thì không khởi động (mặc định an toàn = supabase, thiếu biến Supabase)
        run: |
          docker rm -f ocr >/dev/null
          set +e
          timeout 120 docker run --name ocr-macdinh -e PORT=8080 "$LOCAL" > macdinh.log 2>&1
          rc=$?
          set -e
          docker rm -f ocr-macdinh >/dev/null 2>&1 || true
          echo "mã thoát: $rc"; tail -n 20 macdinh.log
          if [ "$rc" = "0" ] || [ "$rc" = "124" ]; then
            echo "::error::container KHÔNG đặt AUTH_MODE vẫn chạy (mã $rc): mặc định không an toàn"
            exit 1
          fi
          # phải thoát VÌ thiếu biến Supabase (câu lỗi của settings.py chỉ nêu tên biến), không vì lỗi khác
          grep -q "SUPABASE_URL" macdinh.log || { echo "::error::container thoát (mã $rc) nhưng không phải vì thiếu biến Supabase"; exit 1; }
          echo "- Không đặt AUTH_MODE: không khởi động vì thiếu biến Supabase (mã thoát $rc), đúng" >> "$GITHUB_STEP_SUMMARY"

      # Đợt kho-nhom vòng 4: luật bật = AUTH_MODE=supabase + khóa 64 hex + CLIP đã nạp. Khóa THỬ sinh trong job bằng openssl
      # (không phải secret GitHub, không phải khóa thật), che trong log (add-mask), truyền vào container bằng "-e TÊN" (giá
      # trị lấy từ biến môi trường, không nằm trên dòng lệnh), và kiểm log container KHÔNG chứa khóa. Supabase giả ở tên miền
      # .invalid (không bao giờ phân giải): máy chủ vẫn khởi động (JWKS tải lỗi chỉ ghi cảnh báo), không gọi Supabase thật.
      # Mỗi lần chạy giữ giới hạn 1 CPU / 2 GiB như Container App.
      - name: Kho nhóm bật đúng luật (khóa thử sinh trong job; /embed, /ocr không token 401)
        run: |
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          export KHO_NHOM_HMAC_KEY="$key"
          sb=(-e AUTH_MODE=supabase -e SUPABASE_URL=https://kho-nhom-ci.invalid -e SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_gia)
          # chay <tên> <cần "clip nhom"> <tham số -e …>: chạy container, chờ /health 200, so clip.loaded + nhom.enabled
          chay() {
            name=$1; want=$2; shift 2
            docker run -d --name "$name" --memory=2g --memory-swap=2g --cpus=1 -e PORT=8080 -p 127.0.0.1:8081:8080 "$@" "$LOCAL" > /dev/null
            for i in $(seq 1 90); do
              if [ "$(docker inspect -f '{{.State.Running}}' "$name")" != "true" ]; then
                echo "::error::container $name đã dừng trước khi /health trả 200"
                docker logs --tail 40 "$name"
                return 1
              fi
              if [ "$(curl -s -o h.json -w '%{http_code}' http://127.0.0.1:8081/health)" = "200" ]; then
                got=$(python3 -c 'import json; j = json.load(open("h.json")); print(j["clip"]["loaded"], j["nhom"]["enabled"])')
                echo "$name: /health clip / nhom = $got (cần: $want)"
                [ "$got" = "$want" ] || { echo "::error::$name: clip / nhom \"$got\", cần \"$want\""; return 1; }
                return 0
              fi
              sleep 1
            done
            echo "::error::$name: /health không trả 200 sau 90 giây"
            return 1
          }
          khong_lo_khoa() {
            docker logs "$1" > "$1.log" 2>&1
            if grep -qiF -- "$key" "$1.log"; then echo "::error::log của $1 có khóa ký"; return 1; fi
            docker rm -f "$1" > /dev/null
          }
          chay nhom-bat "True True" "${sb[@]}" -e KHO_NHOM_HMAC_KEY
          code=$(curl -s -o embed.json -w '%{http_code}' -F image=@server/tests/fixtures/chu.png -F duong_dan=0d0d0d0d-1111-4000-8000-0000000000aa/0a1b2c3d-0000-4000-8000-00000000c0de.png http://127.0.0.1:8081/embed)
          echo "/embed không token: HTTP $code"; cat embed.json; echo
          [ "$code" = "401" ] || { echo "::error::/embed không token phải 401"; exit 1; }
          code=$(curl -s -o ocr401.json -w '%{http_code}' -F image=@server/tests/fixtures/chu.png http://127.0.0.1:8081/ocr)
          [ "$code" = "401" ] || { echo "::error::/ocr không token phải 401 (HTTP $code)"; exit 1; }
          grep -q "kho nhóm BẬT" <(docker logs nhom-bat 2>&1) || { echo "::error::log nhom-bat thiếu dòng \"kho nhóm BẬT\""; exit 1; }
          khong_lo_khoa nhom-bat
          chay nhom-sai-khoa "True False" "${sb[@]}" -e KHO_NHOM_HMAC_KEY=khong-phai-64-hex
          grep -q "KHO_NHOM_HMAC_KEY sai dạng" <(docker logs nhom-sai-khoa 2>&1) || { echo "::error::thiếu log khóa sai dạng"; exit 1; }
          docker rm -f nhom-sai-khoa > /dev/null
          chay nhom-auth-off "True False" -e AUTH_MODE=off -e KHO_NHOM_HMAC_KEY
          khong_lo_khoa nhom-auth-off
          chay nhom-khong-clip "False False" "${sb[@]}" -e KHO_NHOM_HMAC_KEY -e CLIP_MODEL_PATH=
          khong_lo_khoa nhom-khong-clip
          echo "- Kho nhóm (khóa thử sinh trong job): supabase + khóa + CLIP -> bật, /embed và /ocr không token 401; khóa sai dạng / AUTH_MODE=off / không CLIP -> tắt; log không có khóa: đúng" >> "$GITHUB_STEP_SUMMARY"

      # Từ đây CHỈ trên main (các bước trên đã đạt): đăng nhập ghcr.io bằng GITHUB_TOKEN rồi đẩy 2 tag.
      - name: Đăng nhập ghcr.io
        if: github.ref == 'refs/heads/main'
        # tag lớn như actions/checkout@v7 (docker/login-action bản lớn mới nhất là v4, đọc trang releases 13/11/2026)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Đẩy ảnh (latest + mã commit ngắn)
        if: github.ref == 'refs/heads/main'
        run: |
          short=${GITHUB_SHA::7}
          docker tag "$LOCAL" "$IMAGE:latest"
          docker tag "$LOCAL" "$IMAGE:$short"
          docker push "$IMAGE:$short"
          docker push "$IMAGE:latest" | tee push.log  # pipefail: push hỏng thì bước đỏ (không bị tee che)
          # digest lấy từ dòng "digest: sha256:…" của docker push (RepoDigests có thể trống với kho ảnh containerd);
          # không tìm thấy digest thì vẫn xanh (ảnh đã đẩy xong): "|| true"
          digest=$(grep -o 'sha256:[0-9a-f]\{64\}' push.log | tail -n 1 || true)
          echo "digest: ${digest:-không đọc được}"
          {
            echo "- Đã đẩy: \`$IMAGE:latest\`, \`$IMAGE:$short\`"
            echo "- Digest: \`${digest:-không đọc được}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log container khi hỏng
        if: failure()
        # container ocr có thể đã bị xóa ở bước "Không đặt AUTH_MODE": khi đó in log của lượt chạy đó
        run: docker logs ocr 2>&1 | tail -n 100 || { echo "(container ocr không còn; log lượt chạy ocr-macdinh:)"; cat macdinh.log 2>/dev/null; } || true

      - name: Dọn container
        if: always()
        run: docker rm -f ocr ocr-macdinh nhom-bat nhom-sai-khoa nhom-auth-off nhom-khong-clip >/dev/null 2>&1 || true
