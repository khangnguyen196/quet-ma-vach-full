[pytest]
testpaths = tests
# Test model thật chạy RIÊNG: pytest -m real_model (lượt thường bỏ chúng, pytest in "N deselected", không skip ẩn)
addopts = -m "not real_model" -p no:cacheprovider
markers =
    real_model: nạp RapidOCR thật (chậm hơn, cần model trong venv); chạy bằng pytest -m real_model
